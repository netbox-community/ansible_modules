---
name: All CI related tasks

# Run this workflow every time a new commit pushed to your repository
on: [push, pull_request]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run black
        uses: psf/black@stable

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml
          strict: true

  unit_testing:
    runs-on: ubuntu-24.04
    needs: linting
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # Empty value keeps the Poetry-resolved 2.18.x baseline; "==2.19.9"
        # pins the 2.19 compatibility leg (INT-236). Bump the pin
        # deliberately when evaluating a new 2.19.x point release, not on
        # every upstream release.
        ansible-core: ["", "==2.19.9"]

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: false

      - name: Install Python packages
        run: poetry install --no-root

      - name: Override ansible-core version
        if: matrix.ansible-core != ''
        run: pip install --upgrade "ansible-core${{ matrix.ansible-core }}"

      - name: Build and install collection
        run: |
          ansible-galaxy collection build .
          ansible-galaxy collection install netbox*.tar.gz -p /home/runner/.ansible/collections

      - name: Run Ansible Sanity tests
        run: poetry run ansible-test sanity -v --requirements --python ${{ matrix.python-version }} --skip-test pep8 plugins/
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox

      - name: Run Ansible Unit tests
        run: poetry run ansible-test units -vvv --coverage --python ${{ matrix.python-version }}
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox

      - name: Run Ansible Coverage
        run: poetry run ansible-test coverage report --all --omit "tests/*,hacking/*,docs/*" --show-missing
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox

  integration_testing:
    runs-on: ubuntu-latest
    needs: unit_testing
    env:
      python-version: "3.13"
    strategy:
      fail-fast: false
      matrix:
        include:
          - VERSION: "v4.1"
            NETBOX_DOCKER_VERSION: 3.0.1
          - VERSION: "v4.2"
            NETBOX_DOCKER_VERSION: 3.2.1
          - VERSION: "v4.3"
            NETBOX_DOCKER_VERSION: 3.3.0
          - VERSION: "v4.4"
            NETBOX_DOCKER_VERSION: 3.4.2
          - VERSION: "v4.5"
            NETBOX_DOCKER_VERSION: 4.0.2
          # ansible-core 2.19 compatibility leg against the latest NetBox
          # (INT-236). Pin bumped deliberately, not on every upstream
          # release.
          - VERSION: "v4.5"
            NETBOX_DOCKER_VERSION: 4.0.2
            ansible-core: "==2.19.9"

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone & Start netbox-docker containers - ${{ matrix.VERSION }}
        run: |
          cd ..
          git clone https://github.com/netbox-community/netbox-docker.git
          cd netbox-docker
          git checkout ${{ matrix.NETBOX_DOCKER_VERSION }}
          cp $GITHUB_WORKSPACE/tests/netbox-docker/${{ matrix.VERSION }}/* .
          docker compose up -d --quiet-pull netbox netbox-worker postgres redis redis-cache
          docker container ls
          cd ..

      - name: Set up Python ${{ env.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1.3.4
        with:
          virtualenvs-create: false

      - name: Install Python packages
        run: poetry install --no-root

      - name: Override ansible-core version
        if: matrix.ansible-core != ''
        run: pip install --upgrade "ansible-core${{ matrix.ansible-core }}"

      - name: Build and install collection
        run: |
          ansible-galaxy collection install community.general -p /home/runner/.ansible/collections
          ansible-galaxy collection build .
          ansible-galaxy collection install netbox*.tar.gz -p /home/runner/.ansible/collections

      - name: Wait for NetBox to be available
        run: |
          docker container ls
          docker logs netbox-docker-netbox-1
          timeout 300 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:32768/login/)" != "200" ]]; do echo "waiting for NetBox"; sleep 5; done' || false
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox

      - name: Provision v2 API token (v4.5+)
        if: matrix.VERSION == 'v4.5'
        run: |
          NETBOX_TOKEN=$(bash ./tests/netbox-docker/provision-token.sh)
          # Register the secret with the GitHub Actions runner BEFORE exporting
          # it; runme.sh uses `set -o xtrace` and would otherwise echo the
          # plaintext token when it sources runme_config.
          echo "::add-mask::$NETBOX_TOKEN"
          echo "NETBOX_TOKEN=$NETBOX_TOKEN" >> "$GITHUB_ENV"
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox

      - name: Pre-populate NetBox
        run: ./tests/integration/netbox-deploy.py
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox

      - name: Run inventory tests
        continue-on-error: true
        run: |
          # runme.sh can only see environment via a sourced runme_config file
          # when invoked through ansible-test.
          RUNME_CONFIG="tests/integration/targets/inventory-${{ matrix.VERSION }}/runme_config"
          # Clean up the credential-bearing config even if the test fails.
          trap 'rm -f "$RUNME_CONFIG"' EXIT
          umask 077
          {
            echo "export NETBOX_VERSION=\"${{ matrix.VERSION }}\""
            if [[ -n "${NETBOX_TOKEN:-}" ]]; then
              echo "export NETBOX_TOKEN=\"$NETBOX_TOKEN\""
            fi
          } > "$RUNME_CONFIG"
          chmod 600 "$RUNME_CONFIG"

          ansible-test integration -v --color --coverage --python ${{ env.python-version }} inventory-${{ matrix.VERSION }}
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox

      - name: Run regression tests
        continue-on-error: true
        run: |
          ansible-test integration -v --color --coverage --python ${{ env.python-version }} regression-${{ matrix.VERSION }}
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox

      - name: Run integration tests
        run: |
          ansible-test integration -v --color --coverage --python ${{ env.python-version }} ${{ matrix.VERSION }}
          ansible-test coverage report --all --omit "tests/*,hacking/*,docs/*" --show-missing
        working-directory: /home/runner/.ansible/collections/ansible_collections/netbox/netbox
