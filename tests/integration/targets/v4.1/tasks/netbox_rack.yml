- name: 7 - Create rack with same asset tag and serial number
  netbox.netbox.netbox_rack:
    netbox_url: http://localhost:32768
    netbox_token: "0123456789abcdef0123456789abcdef01234567"
    data:
      name: Test rack two
      site: Test Site
      serial: FXS10001
      asset_tag: "1234"
    state: present
  ignore_errors: true
